<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>IS256 phase variation in the ica locus — S. aureus</title>
<style>
  :root{ --bg:#f4f8fe; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; cursor:pointer; }
  /* ---------- interactive chrome (hidden in render mode) ---------- */
  #ui{ position:fixed; left:0; right:0; bottom:0; z-index:5; padding:8px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
       background:linear-gradient(rgba(244,248,254,0), rgba(244,248,254,.9) 30%); pointer-events:none; }
  #ui > *{ pointer-events:auto; }
  button{ font-family:inherit; border:none; cursor:pointer; color:#fff; background:linear-gradient(135deg,#3b82f6,#2563eb); padding:9px 16px; min-height:40px; border-radius:11px; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(37,99,235,.35); transition:filter .15s, transform .1s; }
  button:hover{ filter:brightness(1.08); } button:active{ transform:scale(.96); }
  #sndBtn{ background:#fff; color:#475569; border:1px solid #c7d4ea; box-shadow:none; min-width:46px; font-size:15px; }
  #dots{ display:flex; gap:7px; align-items:center; }
  .dot{ width:13px; height:13px; border-radius:50%; background:#c7d4ea; border:none; cursor:pointer; padding:0; transition:.2s; box-shadow:none; min-height:0; }
  .dot.active{ background:#f59e0b; transform:scale(1.28); }
  #speedWrap{ display:flex; align-items:center; gap:7px; color:#475569; font-size:13px; font-weight:600; }
  #scrubWrap{ display:flex; align-items:center; gap:7px; color:#475569; font-size:13px; font-weight:600; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:92px; height:5px; border-radius:3px; background:#c7d4ea; outline:none; }
  #scrub{ width:min(38vw,260px); }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  #prog{ position:fixed; left:0; right:0; bottom:0; height:4px; background:#dbe6f5; z-index:6; }
  #progBar{ height:100%; width:0%; background:linear-gradient(90deg,#f59e0b,#fb7185); }
  body.render-mode #ui, body.render-mode #prog{ display:none; }
  /* chapter caption — HTML pill so it keeps a fixed CSS-px size at any window (the old scaled SVG text was illegible and overlapped the control bar) */
  #capPill{ position:fixed; left:max(12px, env(safe-area-inset-left)); bottom:calc(64px + env(safe-area-inset-bottom)); z-index:4; max-width:min(592px, calc(100vw - 32px));
       background:#fff; border:1px solid #c7d4ea; border-radius:14px; box-shadow:0 2px 8px rgba(15,23,42,.10); padding:9px 16px; font-size:15px; line-height:1.45; color:#0f172a; pointer-events:none; }
  @media (max-width:560px){ #capPill{ bottom:calc(120px + env(safe-area-inset-bottom)); font-size:14px; max-width:calc(100vw - 32px); } }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated diagram: the IS256 insertion sequence jumping into and out of the icaC gene of the Staphylococcus aureus ica operon, switching PIA/PNAG production and biofilm formation on and off.">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f1fc"/></linearGradient>
  <radialGradient id="cellGrad" cx=".38" cy=".32" r=".95"><stop offset="0" stop-color="#ffe3b3"/><stop offset=".55" stop-color="#ffb066"/><stop offset="1" stop-color="#f97e2c"/></radialGradient>
  <radialGradient id="miniGrad" cx=".38" cy=".34" r=".9"><stop offset="0" stop-color="#ffe0ad"/><stop offset="1" stop-color="#fb9a45"/></radialGradient>
  <!-- fine cross-hatch fill for the Gram-positive peptidoglycan wall -->
  <pattern id="pgHatch" width="7" height="7" patternUnits="userSpaceOnUse">
    <path d="M0,0 l7,7 M7,0 l-7,7" stroke="#c2410c" stroke-width=".9"/>
  </pattern>
  <!-- per-cell PNAG coat glow — tight rim: the opaque cell covers the centre, so opacity peaks in the .55–.85 band that shows around each cell -->
  <radialGradient id="coatGlow"><stop offset="0" stop-color="#6ee7b7" stop-opacity=".5"/><stop offset=".55" stop-color="#34d399" stop-opacity=".42"/><stop offset=".85" stop-color="#10b981" stop-opacity=".5"/><stop offset="1" stop-color="#10b981" stop-opacity=".12"/></radialGradient>
</defs>

<rect x="-2000" y="-2000" width="7600" height="4800" fill="url(#bgGrad)"/>

<!-- ================= TITLE ================= -->
<g id="titleG">
  <text x="800" y="44" text-anchor="middle" font-size="31" font-weight="800" fill="#1e293b" letter-spacing=".2">IS256 phase variation in the <tspan font-style="italic">ica</tspan> locus</text>
  <text x="800" y="71" text-anchor="middle" font-size="16.5" fill="#64748b"><tspan font-style="italic">Staphylococcus aureus</tspan> — the insertion sequence that jumps in and out of a biofilm gene</text>
  <text x="26" y="98" font-size="13" fill="#a3aec0" font-family="'Segoe Script','Brush Script MT','Comic Sans MS',cursive">© Sean P Nair</text>
</g>

<!-- ================= LEGEND ================= -->
<g id="legendG" font-size="13" fill="#475569"></g>

<!-- ================= GENOME ZONE ================= -->
<g id="genomeG">

  <!-- genes (rounded arrows, all transcribed left→right) -->
  <g id="geneIcaR"><path d="M150,182 h76 l42,23 l-42,23 h-76 z" fill="#7c5cfc"/><text x="200" y="211" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">icaR</text></g>

  <!-- promoter + IcaR repressor at the operator -->
  <path d="M338,196 q4,-26 30,-30 l-4,11 q-16,4 -17,15 z" fill="#f59e0b"/>
  <g id="icaRDimer">
    <rect x="283" y="184" width="26" height="42" rx="8" fill="#8b5cf6"/>
    <rect x="311" y="190" width="26" height="30" rx="8" fill="#a78bfa"/>
  </g>
  <text id="icaRLabel" x="296" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7c3aed">IcaR</text>

  <g id="geneIcaA"><path d="M420,182 h136 l54,23 l-54,23 h-136 z" fill="#4d7cfe"/><text x="509" y="211" text-anchor="middle" font-size="16.5" font-weight="700" fill="#fff">icaA</text></g>

    <rect x="63"  y="-23" width="22" height="46" rx="9" fill="#c2410c"/>

  <rect id="tsdL" x="999" y="200.5" width="9" height="9" rx="3" fill="#22d3ee"/>

  <!-- transposase callout (chapter 2) -->
  <g id="tnpCallG">
    <line x1="1385" y1="232" x2="1385" y2="262" stroke="#c2410c" stroke-width="2"/>
    <text x="1385" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#c2410c">transposase tnp256 cuts IS256 out</text>
  </g>

  <!-- precise-excision callout (chapter 4) -->
  <g id="excCallG">
    <line x1="1089" y1="238" x2="1089" y2="262" stroke="#0e7490" stroke-width="2"/>
    <text x="1089" y="281" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0e7490">precise excision — IS256 + the duplicated 8-bp copies leave; original sequence restored</text>
  </g>

  <!-- mRNA transcript -->
  <path id="mrnaH" d="M330,244 H690" fill="none" stroke="#f59e0b" stroke-width="4.5"/>
  <line id="mrnaV" x1="690" y1="244" x2="690" y2="398" stroke="#f59e0b" stroke-width="4.5"/>
  <path id="mRnaHead" d="M690,414 l-9,-16 h18 z" fill="#f59e0b"/>
  <g id="mrnaX">

  </g>
  <text id="mrnaLblOn" x="520" y="272" text-anchor="middle" font-size="13.5" fill="#b45309"><tspan font-style="italic">icaADBC</tspan> mRNA → IcaA·D, IcaB, IcaC proteins</text>
  <g id="mrnaLblOffG">
    <rect x="826" y="284" width="390" height="30" rx="15" fill="#fffbeb" stroke="#fde68a"/>
    <text x="1021" y="305" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">icaADBC still transcribed — only icaC lost</text>
  </g>
</g>

<!-- ================= CELL ZONE ================= -->
<g id="cellG">
  <!-- PNAG coat (drawn under cell so it reads as a surface corona) — deacetylated, green -->

  <circle cx="560" cy="570" r="181" fill="none" stroke="#f59e0b" stroke-opacity=".3" stroke-width="16"/>

    <circle cx="386" cy="523" r="2.6" fill="#9a3412"/>
    <text x="366" y="700" text-anchor="end" fill="#334155">cell membrane</text>

    <text x="427" y="428" text-anchor="middle" font-size="14.5" font-weight="700" fill="#6d28d9">UDP-GlcNAc</text>
  </g>
  <line id="udpArrow" x1="506" y1="424" x2="556" y2="413" stroke="#a78bfa" stroke-width="3.5"/>
  <path id="udpHead" d="M566,411 l-11.6,7.7 l-2.2,-9.8 z" fill="#a78bfa"/>

  <!-- IcaA·D transferase complex (transmembrane — spans cytoplasmic face through the wall) -->

    <text x="595" y="401" text-anchor="middle" font-size="14.5" font-weight="800" fill="#fff">IcaA·D</text>
    <text x="595" y="417" text-anchor="middle" font-size="8" fill="#ccfbf1">transferase</text>
  </g>

  <!-- IcaC channel — straddles the wall band; label sits at the top so the threading strand crosses clear -->
  <g id="icaCG">
    <rect x="707" y="583" width="58" height="56" rx="12" fill="#8b5cf6"/>
    <text x="736" y="599" text-anchor="middle" font-size="15.5" font-weight="800" fill="#fff">IcaC</text>

    <g id="icaBG">
      <rect x="706" y="636" width="92" height="40" rx="13" fill="#fbbf24"/>
      <text x="712" y="652" font-size="14.5" font-weight="800" fill="#78350f">IcaB</text>

  <!-- PNAG strand — topmost in the cell zone: dark-navy linked monomers inside, green deacetylated from IcaB exit; dots built by JS -->

  <text id="oligoLbl" x="706" y="500" text-anchor="middle" font-size="12.5" fill="#92400e">short oligomers (&lt;20 units) — can't be exported</text>
  <g id="coatLblG">
    <rect x="762" y="398" width="170" height="28" rx="14" fill="#fffbeb" stroke="#fde68a"/>
    <text x="847" y="417" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b45309">PNAG coat (PIA/PNAG)</text>

  <g id="linkLblOffG">
    <rect x="1210" y="768" width="190" height="28" rx="14" fill="#fff1f2" stroke="#fecaca"/>
    <text x="1305" y="787" text-anchor="middle" font-size="13.5" font-weight="700" fill="#dc2626">no PNAG → no adhesion</text>

</g>

<!-- ================= DEVICE / BIOFILM ZONE ================= -->

  <!-- planktonic drift positions -->
  <g id="plankLblG">

    <text x="911" y="749" text-anchor="middle" font-size="16.5" font-weight="800" fill="#15803d">PIA/PNAG⁺</text>
  </g>
  <g id="chipOffG">
    <rect x="836" y="722" width="150" height="40" rx="20" fill="#fee2e2" stroke="#f87171"/>

</svg>

<div id="capPill"></div>
<div id="ui">
  <button id="playBtn" type="button">⏸ Pause</button>
  <div id="dots"></div>
  <div id="speedWrap"><span>Speed</span><input id="spd" type="range" min="0.5" max="2" step="0.1" value="1"/><span id="spdVal">1×</span></div>
  <div id="scrubWrap"><input id="scrub" type="range" min="0" max="36" step="0.01" value="0" aria-label="Scrub the timeline to any point in the 36-second loop"/><span id="tVal">0.0s</span></div>
  <button id="sndBtn" type="button" title="Sound off — tap the canvas to enable, click here to toggle">🔇</button>
</div>
<div id="prog"><div id="progBar"></div></div>

<script>
"use strict";
/* ============================================================
   IS256 × ica locus — deterministic timeline animation.
   Every visual state is a pure function of t (seconds, 0..D).
   URL modes: ?t=<sec> seek · ?render=1 capture mode · ?test=1 self-test
   Biology: S. aureus icaR–icaA–icaD–icaB–icaC; IS256 hot spot in icaC
   (Kiem et al. 2004, Ziebuhr et al. 1999); IcaR = DNA repressor.
   ============================================================ */

const D = 36;                 // loop duration (s)
const CH = [0, 9, 18, 27];    // chapter starts
const CAPTIONS = [
  ["<b>ON</b> — intact <i>icaADBC</i> operon: IcaA·D builds the GlcNAc chain from UDP-GlcNAc,","the chain threads through IcaC; IcaB deacetylates it outside → PNAG coat → biofilm on devices."],
  ["<b>JUMP IN</b> — transposase tnp256 cuts IS256 (~1.3 kb) out of its old site;","cut-and-paste integration lands in the <i>icaC</i> hot spot, duplicating 8 bp at each end (TSD)."],
  ["<b>OFF</b> — no functional IcaC: the polymer can't be exported.","No PNAG on the surface → smooth cells drift free; the biofilm falls apart."],
  ["<b>JUMP OUT</b> — precise excision removes IS256 together with the duplicated 8-bp","TSD copies, restoring <i>icaC</i> exactly. PIA/PNAG⁺ and biofilm return — phase variation."]
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const seg = (t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeIO = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeO  = t=> 1-Math.pow(1-t,3);
function setOp(el,f){ if(f==null) return; el.setAttribute("opacity", f.toFixed(3)); }

/* ---------- params / modes ---------- */
const P = new URLSearchParams(location.search);
let renderMode = P.get("render")==="1";
let testMode   = P.get("test")==="1";
let seekT      = P.has("t") ? clamp(parseFloat(P.get("t"))||0, 0, D-0.001) : null;

/* ---------- build legend ---------- */
(function buildLegend(){
  const items = [
    ["#4d7cfe","ica operon genes"],["#8b5cf6","IcaR repressor"],["#f97362","IS256 element"],
    ["#22d3ee","TSD (8-bp duplication)"],["#1e3a8a","PNAG (GlcNAc, inside)"],["#cbd5e1","Surface"],
    ["#34d399","deacetylated PNAG (coat)"]
  ];
  const g = $("legendG"); let x=980, y=106;
  for(let i=0;i<items.length;i++){

    const [c,label]=items[i];

/* ---------- PNAG rope geometry: transferase anchor → inner arc → through the IcaC channel → outer run to the coat fade point ---------- */
const ROPE_D = "M626 435 L644.3 449.5 A147 147 0 0 1 702 608 L765 619 A211 211 0 0 1 737 685";
const chainLine = $("chainLine");
chainLine.setAttribute("d", ROPE_D);
const ROPE_LEN = chainLine.getTotalLength();
// arclength at the IcaB exit (colour split navy→green + deacetylation halo happen here).
// ≈37px before the rope end (≈301.7 on the 16px lattice, ~8px clear of both neighbours): in steady state the last THREE units (s=310, 326, 342) sit past this point and read as deacetylated coat-green.
const S_ICAB = ROPE_LEN - 37;
const PITCH = 16, ROPE_A = 6;                    // unit spacing along the rope / first dot offset from the anchor
const NDOTS = Math.ceil((ROPE_LEN-14)/PITCH);    // steady-state visible units (constant length rope)
const NCOAT1=64, NCOAT2=56;                      // bead counts on coat rings r204 / r182
const ropeDots = [];                              // pool j∈[-3,NDOTS-1]: 3 spare units at the transferase end for pop-in
{ const g=$("beadsG");
  for(let j=-3;j<NDOTS;j++){
    const c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("r","5.5"); c.setAttribute("fill","#1e3a8a"); c.setAttribute("opacity","0");
    g.appendChild(c); ropeDots.push({el:c, j});
  } }

/* ---------- biofilm geometry ---------- */
const BF_HOME = [[1090,772],[1156,772],[1222,772],[1288,772],[1354,772],[1180,730],[1288,728]];
const BF_FREE = [[980,668],[1120,640],[1262,652],[1400,668],[1512,690],[1072,596],[1332,588]];
const BF_R=[30,30,30,30,30,28,28];   // cell radii (halo base size)

/* ---------- per-frame state (exposed for ?test=1) ---------- */
const S = {};

function render(t){
  t = ((t % D) + D) % D;
  const ch = t<9?0 : t<18?1 : t<27?2 : 3;

  /* ----- genome: IS256 element position ----- */
  let ix=1385, iy=205, irot=0, iscale=1;
  if(ch===1){                                    /* excise → fly to hot spot */
    const p = easeIO(seg(t,10.4,13.6));
    ix = 1385 + (1089-1385)*p;                   // lands inside the split icaC (box [1004,1174])
    iy = 205 - Math.sin(p*Math.PI)*150;
    irot = Math.sin(p*Math.PI)*4;
    iscale = 1-.3*Math.sin(p*Math.PI);           /* shrink in flight so it clears the legend */
  } else if(ch===2){ ix=1089; }
  else if(ch===3){                               /* precise excision, flies home carrying TSDs */
    const p = easeIO(seg(t,28.2,31.2));
    ix = 1089 + (1385-1089)*p;
    iy = 205 - Math.sin(p*Math.PI)*150;
    irot = -Math.sin(p*Math.PI)*4;
    iscale = 1-.3*Math.sin(p*Math.PI);
  }
  $("is256G").setAttribute("transform", `translate(${ix.toFixed(1)},${iy.toFixed(1)}) rotate(${irot.toFixed(2)}) scale(${iscale.toFixed(3)})`);

  /* home-site ghost + nicks (element away from home) */
  const away = (ch===1 && t>=10.4) || ch===2 || (ch===3 && t<31.4);
  setOp($("homeGhost"), away? .8:0);
  setOp($("nickL"), away? .9:0); setOp($("nickR"), away? .9:0);

  /* hotspot marker */
  const hs = (ch===0) ? 1 : ch===1 ? 1-seg(t,13.5,14) : ch===3 ? seg(t,31.6,33) : 0;   // target mark stays up until IS256 lands on it
  setOp($("hotspotG"), hs);

  /* TSD markers — static hotspot pointers, never travel with the element. tsdL + tsdRJ mark BOTH duplicated 8-bp copies flanking IS256 in icaC (appear as it lands, gone by takeoff); tsdR marks the home-site hot spot on the genome (left behind once IS256 excises) */
  const tsdGene = ch===1 ? easeO(seg(t,13.5,13.95)) : ch===2 ? 1 : ch===3 ? clamp((28.7-t)/0.7,0,1) : 0;
  setOp($("tsdL"), tsdGene);
  setOp($("tsdRJ"), tsdGene);
  setOp($("tsdR"), away? .9:0);

  /* icaC broken state; while IS256 is in situ the gene reads as two fragments flanking it (region longer than intact) */
  const broken = (ch===1 && t>13.8) || ch===2 || (ch===3 && t<28.2);      // split the instant IS256 lands; reformed instantly at takeoff
  const splitOp = ch===0?0 : ch===1 ? easeIO(seg(t,13.5,13.85)) : ch===2 ? 1 : (t<28.2?1:0);
  setOp($("geneIcaC"), (1-splitOp)*(broken?.35:1));                       // intact arrow ↔ split fragments crossfade
  for(const c of $("icaCSplitG").children) c.setAttribute("opacity", broken?.35:1);
  setOp($("icaCSplitG"), splitOp);
  setOp($("xIcaC"), broken? .95:0);

  /* transposase + excision callouts */
  setOp($("tnpCallG"), ch===1 ? Math.min(seg(t,9.4,10), 1-seg(t,16.8,17.8)) : 0);
  const ex = ch===3 ? Math.min(seg(t,27.2,28), 1-seg(t,31.8,32.8)) : 0;
  setOp($("excCallG"), ex);

  /* ----- mRNA flow — transcribed in ALL chapters: IS256 sits in icaC, the LAST gene of the operon, so there is no
     polar effect on icaA/icaD/icaB; the transcript keeps flowing and only IcaC function (export) is lost. ----- */
  setOp($("mrnaH"), 1); setOp($("mrnaV"), .96); setOp($("mRnaHead"), 1);
  const mOff = (t*10)%20;
  $("mrnaH").setAttribute("stroke-dasharray","12 8"); $("mrnaH").setAttribute("stroke-dashoffset", -mOff);
  $("mrnaV").setAttribute("stroke-dasharray","12 8"); $("mrnaV").setAttribute("stroke-dashoffset", -mOff*1.5);

  const blk = (ch===1 && t>=13.9) || ch===2 || (ch===3 && t<28.2);   // IS256 in situ → export blocked
  setOp($("mrnaX"), 0);                                              // no ✕ on the transcript — it is never interrupted
  setOp($("mrnaLblOn"), blk? 0:.95);
  setOp($("mrnaLblOffG"), blk? .98:0);

  /* ----- cell machinery — visible in ALL chapters: IS256 lands in icaC (3′ end), so icaA/icaD/icaB keep being
     transcribed and IcaA·D + IcaB stay up; only IcaC is lost, trapping short oligomers inside. ----- */
  setOp($("transferG"), .98); setOp($("udpG"), .95);
  setOp($("udpArrow"), .9);   setOp($("udpHead"), .9);
  setOp($("icaBG"), .97);

  /* PNAG strand: steady rope flow threading through IcaC (peristaltic beats in ch0); the tail retracts to a trapped
     3-unit stub when the operon is off; regrows anchor-first in ch3. Settled state ≡ frame(0) → seam-safe. */
  setOp($("oligoLbl"), (ch===1&&t>16)||ch===2 ? .95 : 0);

  let phi=0, beatOn=false, pdx=0, pdy=0, pu=0;               // peristaltic phase in pitches — beats run until IS256 lands (ch1)
  if(ch===0 || ch===1){ for(const tb of [0.8,3.6,6.4,9.8,12.7]){ const u=(t-tb)/0.7;
    if(u>=1) phi+=1; else if(u>0){ phi+=easeO(u); beatOn=true;
      pu=Math.sin(Math.PI*u); pdx=9*pu; pdy=6*pu; } } }
  if(ch===1 && t>14.4) phi = 5*(1-easeIO(seg(t,14.4,17.2)));   // strand pulled back to the anchor during retraction → ch2 stub matches exactly

  let chainLen=0, maxS=0;
  for(const d of ropeDots){
    const j=d.j, s=ROPE_A+(j+phi)*PITCH;                      // arclength along the rope (anchor → coat fade)
    let op;
    if(ch===0) op=1;
    else if(ch===1) op = t<14 || j<=2 ? 1 : 1-seg(t, 14.2+((NDOTS-1-j)/(NDOTS-3))*1.5, 14.55+((NDOTS-1-j)/(NDOTS-3))*1.5);  // tail retracts first as IS256 seats
    else if(ch===2) op = j<=2 ? 1 : 0;                        // trapped stub at the transferase anchor
    else op = j<=2 ? (t<32.4 ? 1-seg(t,31.6,32.4) : 1)        // ch3: stub dissolves…
                    : easeO(seg(t, 32.2+(j-2)*.08, 32.55+(j-2)*.08));   // …strand regrows anchor-first (done ≈t34 < seam)
    if(s<-8||s>ROPE_LEN+14) op=0;                             // outside the rope: new unit pops in at the anchor, tip is absorbed past IcaB
    else op*=Math.min(1,seg(s,-8,12))*(1-seg(s,ROPE_LEN-6,ROPE_LEN+14));
    d.el.setAttribute("opacity",op.toFixed(3));
    if(op>.02){ const p=chainLine.getPointAtLength(Math.max(0,s));
      d.el.setAttribute("cx",p.x); d.el.setAttribute("cy",p.y);
      d.el.setAttribute("r",(5.5*Math.min(1,seg(s,-8,12))).toFixed(2));
      d.el.setAttribute("fill", s<S_ICAB ? "#1e3a8a" : "#34d399");     // deacetylated green from IcaB exit
      if(op>0.05 && s>maxS) maxS=Math.min(s,ROPE_LEN); }
    if(op>=.5) chainLen++;
  }
  // backbone: one dash from the anchor to the furthest visible bead links the monomers (hidden only in the ch3 dissolve gap)
  chainLine.setAttribute("stroke-dasharray", `${maxS.toFixed(1)} ${ROPE_LEN}`);
  setOp(chainLine, maxS>2?1:0);

  /* IcaB deacetylation flash: fires as a unit crosses IcaB's exit during a beat (0 at rest → seam-safe) */
  let halo=0;
  if(beatOn){ let dm=1e9; for(const d of ropeDots){ const s=ROPE_A+(d.j+phi)*PITCH; dm=Math.min(dm,Math.abs(s-S_ICAB)); }
    halo=1-seg(dm,5,13); }
  setOp($("icaBHi"), halo===0 ? 0 : .15+.85*halo);
  $("icaBWrap").setAttribute("transform",`translate(${(4*halo).toFixed(2)},${(2.5*halo).toFixed(2)})`);
  $("udpG").setAttribute("transform",`translate(${pdx.toFixed(1)},${pdy.toFixed(1)})`);

  S.chainLen=chainLen;
  S.exported = ch===0 ? Math.round(phi) : 0;                  // units converted at IcaC this cycle (resets with the loop)

  /* IcaC channel state */
  const chOff = (ch===1&&t>=13.9)||ch===2||(ch===3&&t<31.4);   // membrane channel lags the gene: stays blocked until excision lands home
  $("icaCG").setAttribute("fill-opacity", chOff? .3:1);
  setOp($("xIcaCP"), chOff? .95:0);

  /* PNAG coat — bead advance synced to peristaltic beats (same speed as secreted chain); thickness grows >1 bead */
  const coat = ch===0 ? 1 : ch===1 ? (t<13.9?1:1-seg(t,13.9,15.5)) : ch===3 ? easeO(seg(t,33.2,35.4)) : 0;
  const coatDepth = 1+1.6*clamp(phi/3,0,1);   // builds from ~1 bead to ~2.6 layers across the ON phase (phi loop-periodic → seam-safe)
  setOp($("coat1"), coat*.9); setOp($("coat2"), coat*.8);
  if(coat>0){
    const p1=Math.PI*408/NCOAT1, p2=Math.PI*364/NCOAT2;   // one bead pitch per exported unit = chain speed
    $("coat1").setAttribute("stroke-dasharray", (p1*.32).toFixed(2)+" "+(p1*.68).toFixed(2));
    $("coat1").setAttribute("stroke-dashoffset", (-phi*p1).toFixed(2));   // advances exactly one bead pitch per beat = chain speed
    $("coat1").setAttribute("stroke-width", (6+7*(coatDepth-1)).toFixed(2));
    $("coat2").setAttribute("stroke-dasharray", (p2*.30).toFixed(2)+" "+(p2*.70).toFixed(2));
    $("coat2").setAttribute("stroke-dashoffset", (-phi*p2*.85).toFixed(2));  // inner ring trails slightly → sliding-overlay look
    $("coat2").setAttribute("stroke-width", (4.5+5*(coatDepth-1)).toFixed(2));
  }
  setOp($("coatLblG"), coat>.4? .97:0);

  /* ----- biofilm / device zone ----- */
  const bf = ch===0 ? 1 : ch===1 ? (t<13.9?1:1-easeIO(seg(t,13.9,15.5))) : ch===3 ? easeIO(seg(t,33.4,35.6)) : 0;
  const plank = ch===0 ? 0 : ch===1 ? (t<13.9?0:easeIO(seg(t,13.9,15.5))) : ch===2 ? 1 : 1-bf;
  for(let i=0;i<7;i++){
    const c=$("bf"+i), [hx,hy]=BF_HOME[i], [fx,fy]=BF_FREE[i];
    let x=hx, y=hy;
    if(ch===1 && t>=13.9){ const p=easeIO(seg(t,13.9,15.5)); x=hx+(fx-hx)*p; y=hy+(fy-hy)*p+Math.sin(t*2.1+i*1.7)*4*p; }
    else if(ch===2){ x=fx; y=fy+Math.sin(t*2.1+i*1.7)*4; }
    else if(ch===3){ const p=bf; x=hx+(fx-hx)*(1-p); y=hy+(fy-hy)*(1-p)+Math.sin(t*2.1+i*1.7)*4*(1-p); }
    c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); setOp(c,1);
    const h=$("halo"+i);                                                  // diffuse per-cell PNAG coat: blooms cell-by-cell as the biofilm settles
    h.setAttribute("cx",x.toFixed(1)); h.setAttribute("cy",y.toFixed(1));
    h.setAttribute("r",(BF_R[i]+9+8*(coatDepth-1)+(beatOn?4*pu:0)).toFixed(1)); // coat builds up with secretion + swells each peristaltic beat
    setOp(h, easeO(seg(bf, i*.1, .3+i*.1))*.95);
  }
  /* chips */
  const chipOn = ch===0 ? 1 : ch===1 ? (t<13.9?1:1-seg(t,13.9,14.7)) : ch===3 ? seg(t,32.4,33.2) : 0;
  const chipOff = (ch===1&&t>=13.9)? seg(t,14.1,15.1) : ch===2?1 : (ch===3 && t<32.8)? clamp((32.8-t)/0.8,0,1) : 0;
  setOp($("chipOnG"),chipOn); setOp($("chipOffG"),chipOff);

  /* adhesion link */
  const stick = chipOn>0 ? .95*(ch===3?seg(t,32.4,33.4):1) : 0;
  setOp($("linkPath"), stick*.9); setOp($("linkHeadP"), stick); setOp($("linkLblOn"), stick);
  if(stick>0){ $("linkPath").setAttribute("stroke-dasharray","10 8"); $("linkPath").setAttribute("stroke-dashoffset", -((t*34)%18)); }
  const noStick = (ch===1&&t>=13.9)? seg(t,14.8,15.6) : ch===2 ? 1 : (ch===3 && t<32.4) ? clamp((32.4-t)/0.8,0,1) : 0;
  setOp($("linkX"), noStick*.95); setOp($("linkLblOffG"), noStick);

  /* planktonic label */
  setOp($("plankLblG"), ch===2 ? seg(t,22.4,23.6) : (ch===3 && t<33.4)? clamp((33.8-t)/0.8,0,1) : 0);

  /* caption */
  const cap = $("capPill"), ck = ch+"|"+CAPTIONS[ch][0].length;
  if(cap.dataset.k!==ck){ cap.dataset.k=ck; cap.innerHTML = CAPTIONS[ch][0]+"<br>"+CAPTIONS[ch][1]; }
  setOp($("titleG"), .98);

  S.t=t; S.chapter=ch;
  S.is256={x:ix,y:iy,insideIcaC:(ix>=1004&&ix<=1174),atHome:(ix>1370)}; // in-situ span at the split-icaC hot spot (IS256 box)
  S.icaCBroken=broken; S.mRNAon=true; S.exportBlocked=blk; S.coat=coat; S.biofilm=bf; S.planktonic=plank;   // mRNA on in every chapter (no polar effect); export blocked only while IS256 is in situ
}

/* ---------- self-test (?test=1) ---------- */
function runSelfTest(){
  const checks=[
    [2,  s=>s.chapter===0 && !s.icaCBroken && s.mRNAon],
    [0.5,s=>Math.abs(s.chainLen-NDOTS)<=1],                           // settled start: full rope threaded through IcaC
    [5.0,s=>Math.abs(s.chainLen-NDOTS)<=1],                           // constant length mid-beat (flow, not loss)
    [7.9,s=>Math.abs(s.chainLen-NDOTS)<=1],                           // holds full after the third peristaltic beat
    [2,  s=>s.exported===1],                                          // one unit converted at IcaC…
    [8,  s=>s.exported===3],                                          // …three by end of chapter 0
    [20, s=>s.chainLen===3 && s.exported===0],                        // trapped 3-unit stub after IS256 excision
    [34.5,s=>Math.abs(s.chainLen-NDOTS)<=1 && s.chapter===3],         // regrown rope in ch3
    [7.5,s=>s.coat>.6 && s.biofilm>.8 && s.is256.atHome],
    [12, s=>!s.is256.atHome && Math.abs(s.is256.y-205)>40],          // in flight (arc apex)
    [14,  s=>s.chainLen>=NDOTS-3],                                   // rope still essentially full as IS256 lands (synthesis ran to the insertion)
    [17.5,s=>s.is256.insideIcaC && s.icaCBroken && s.exportBlocked && s.mRNAon],   // IS256 seated: export blocked but icaADBC still transcribed
    [23, s=>s.planktonic>.9 && s.biofilm<.05 && s.coat<.05 && s.icaCBroken],
    [31.6, s=>!s.is256.insideIcaC && !s.icaCBroken],                  // excised, gene restored
    [34.8,s=>s.mRNAon && s.coat>.5 && s.biofilm>.7 && s.is256.atHome]
  ];
  let ok=true; const fails=[];
  for(const [t,pred] of checks){ render(t); if(!pred(S)) {ok=false; fails.push(`t=${t}: state=${JSON.stringify(S)}`);} }
  /* seam: last frame ≈ first frame (visual state only) */
  const snap = () => ({x:Math.round(S.is256.x),y:Math.round(S.is256.y),coat:+S.coat.toFixed(2),biofilm:+S.biofilm.toFixed(2),mRNAon:S.mRNAon,exportBlocked:S.exportBlocked,broken:S.icaCBroken,planktonic:+S.planktonic.toFixed(2),chainLen:S.chainLen,exported:S.exported});
  render(35.98); const a=snap();
  render(0.02);   const b=snap();
  if(Math.abs(a.x-b.x)>4||Math.abs(a.y-b.y)>4||Math.abs(a.coat-b.coat)>.1||Math.abs(a.biofilm-b.biofilm)>.1||a.mRNAon!==b.mRNAon||a.exportBlocked!==b.exportBlocked||a.broken!==b.broken||a.chainLen!==b.chainLen||a.exported!==b.exported){ ok=false; fails.push(`seam mismatch ${JSON.stringify({end:a,start:b})}`); }
  document.body.dataset.selftest = ok?"PASS":"FAIL";
  $("badge").textContent = `self-test: ${ok?"PASS":"FAIL"}`+(fails.length? " — "+fails[0]:"");
  return {ok, fails};
}

/* ---------- sound effects (Web Audio — synthesized, no files) ----------
   Silent until the first user gesture arms it; never fires in render/test mode. */
let AC=null, soundOn=false, sndArmed=false;
const sndBtn=$("sndBtn");
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0,f1,dur,type,gain,when=0){
  const c=ac(); if(!c||c.state!=="running") return;
  const t0=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t0);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain,t0+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+.05);
}
const SFX={
  tick:    ()=>tone(880,620,.09,"triangle",.07),                       /* chapter change */
  thud:    ()=>tone(130,52,.4,"sine",.18),                             /* IS256 lands in icaC */
  chirp:   ()=>tone(300,950,.35,"sawtooth",.07),                       /* excision out of icaC */
  chime:   ()=>{ tone(659,0,.5,"sine",.1); tone(988,0,.5,"sine",.06,.07); }, /* coat regrows */
  fadeout: ()=>tone(420,150,.6,"sine",.09)                             /* biofilm falls apart */
};
function syncSndBtn(){ sndBtn.textContent=soundOn?"🔊":"🔇"; sndBtn.title=soundOn?"Mute sound effects":"Sound off — tap the canvas to enable, click here to toggle"; }
if(!renderMode && !testMode){
  const arm=()=>{ if(sndArmed) return; sndArmed=true; soundOn=true; syncSndBtn(); const c=ac(); if(c&&c.state==="suspended") c.resume(); };
  window.addEventListener("pointerdown",arm);
  window.addEventListener("keydown",arm);
}
sndBtn.addEventListener("click",e=>{ e.stopPropagation(); const c=ac(); if(c&&c.state==="suspended") c.resume(); soundOn=!soundOn; syncSndBtn(); });

/* ---------- interaction / loop ---------- */
let speed=1, last=null;
const playBtn=$("playBtn"), dotsG=$("dots");
for(let i=0;i<4;i++){ const d=document.createElement("button"); d.className="dot"; d.type="button";
  d.addEventListener("click",e=>{ e.stopPropagation(); seek(CH[i]+0.01); }); dotsG.appendChild(d); }

function seek(t){ if(seekT!=null) return; curT=clamp(t,0,D-0.001); render(curT); last=null; syncUI(curT); }
function syncUI(t){
  const ch = t<9?0 : t<18?1 : t<27?2 : 3;
  [...dotsG.children].forEach((d,i)=>d.classList.toggle("active",i===ch));
  $("progBar").style.width=(t/D*100).toFixed(2)+"%";
  if(!scrubbing) scrub.value = t.toFixed(2);
  tVal.textContent = t.toFixed(1)+"s";
}
playBtn.addEventListener("click",e=>{ e.stopPropagation(); playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });
const scrub=$("scrub"), tVal=$("tVal"); let scrubbing=false;
scrub.max = (D-0.02).toFixed(2);
scrub.addEventListener("pointerdown",()=>{ scrubbing=true; });
window.addEventListener("pointerup",()=>{ scrubbing=false; });
scrub.addEventListener("input",e=>{ e.stopPropagation(); seek(parseFloat(scrub.value)); });
$("spd").addEventListener("input",()=>{ speed=parseFloat($("spd").value); $("spdVal").textContent=speed.toFixed(1)+"×"; });
if(!renderMode) $("stage").addEventListener("pointerdown",e=>{ if(e.target.closest("#ui")) return; playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* frozen frame in capture/test mode and when an explicit ?t= is given (play button still starts it) */
let playing = !(renderMode || testMode) && seekT==null && !reduce;
playBtn.textContent = playing?"⏸ Pause":"▶ Play";

let curT = seekT!=null ? seekT : 0, prevSnap=null;
function frame(ts){
  if(playing && last!=null){
    curT=(curT+(ts-last)/1000*speed)%D; render(curT); syncUI(curT);
    const now={ch:S.chapter,inIca:!!S.is256.insideIcaC,coat:+S.coat.toFixed(3),bf:+S.biofilm.toFixed(3)};
    if(soundOn && prevSnap){
      if(now.ch!==prevSnap.ch) SFX.tick();
      if(!prevSnap.inIca && now.inIca) SFX.thud();
      else if(prevSnap.inIca && !now.inIca) SFX.chirp();
      if(prevSnap.coat<.5 && now.coat>=.5) SFX.chime();
      if(prevSnap.bf>.5 && now.bf<=.5) SFX.fadeout();
    }
    prevSnap=now;
  } else { last=null; prevSnap=null; }
  last=ts; requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
if(renderMode) document.body.classList.add("render-mode");
render(curT); syncUI(curT);
if(testMode){ const r=runSelfTest(); console.log(r.ok?"SELF-TEST PASS":"SELF-TEST FAIL", r.fails||""); }
requestAnimationFrame(frame);
window.__IS256 = { render, D, state:()=>S };   // handle for external frame capture
</script>
</body>
