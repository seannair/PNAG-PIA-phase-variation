<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>IS256 phase variation in the ica locus — S. aureus</title>
<style>
  :root{ --bg:#f4f8fe; }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:var(--bg); overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #stage{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; cursor:pointer; }
  /* ---------- interactive chrome (hidden in render mode) ---------- */
  #ui{ position:fixed; left:0; right:0; bottom:0; z-index:5; padding:8px max(12px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
       background:linear-gradient(rgba(244,248,254,0), rgba(244,248,254,.9) 30%); pointer-events:none; }
  #ui > *{ pointer-events:auto; }
  button{ font-family:inherit; border:none; cursor:pointer; color:#fff; background:linear-gradient(135deg,#3b82f6,#2563eb); padding:9px 16px; min-height:40px; border-radius:11px; font-size:14px; font-weight:600; box-shadow:0 2px 8px rgba(37,99,235,.35); transition:filter .15s, transform .1s; }
  button:hover{ filter:brightness(1.08); } button:active{ transform:scale(.96); }
  #dots{ display:flex; gap:7px; align-items:center; }
  .dot{ width:13px; height:13px; border-radius:50%; background:#c7d4ea; border:none; cursor:pointer; padding:0; transition:.2s; box-shadow:none; min-height:0; }
  .dot.active{ background:#f59e0b; transform:scale(1.28); }
  #speedWrap{ display:flex; align-items:center; gap:7px; color:#475569; font-size:13px; font-weight:600; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:92px; height:5px; border-radius:3px; background:#c7d4ea; outline:none; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  input[type=range]::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:#f59e0b; cursor:pointer; border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  #prog{ position:fixed; left:0; right:0; bottom:0; height:4px; background:#dbe6f5; z-index:6; }
  #progBar{ height:100%; width:0%; background:linear-gradient(90deg,#f59e0b,#fb7185); }
  body.render-mode #ui, body.render-mode #prog{ display:none; }
</style>
</head>
<body>

  <radialGradient id="cellGrad" cx=".38" cy=".32" r=".95"><stop offset="0" stop-color="#ffe3b3"/><stop offset=".55" stop-color="#ffb066"/><stop offset="1" stop-color="#f97e2c"/></radialGradient>
  <radialGradient id="miniGrad" cx=".38" cy=".34" r=".9"><stop offset="0" stop-color="#ffe0ad"/><stop offset="1" stop-color="#fb9a45"/></radialGradient>
</defs>

<rect x="-2000" y="-2000" width="7600" height="4800" fill="url(#bgGrad)"/>

  <circle id="bf2" cx="1222" cy="772" r="30" fill="url(#miniGrad)" stroke="#fb923c" stroke-width="4"/>
  <circle id="bf3" cx="1288" cy="772" r="30" fill="url(#miniGrad)" stroke="#fb923c" stroke-width="4"/>
  <circle id="bf4" cx="1354" cy="772" r="30" fill="url(#miniGrad)" stroke="#fb923c" stroke-width="4"/>
  <circle id="bf5" cx="1180" cy="730" r="28" fill="url(#miniGrad)" stroke="#fb923c" stroke-width="4"/>

<!-- render/test badge -->

</svg>

<div id="ui">
  <button id="playBtn" type="button">⏸ Pause</button>
  <div id="dots"></div>
  <div id="speedWrap"><span>Speed</span><input id="spd" type="range" min="0.5" max="2" step="0.1" value="1"/><span id="spdVal">1×</span></div>
  <button id="resetBtn" type="button">↺ Restart</button>
</div>
<div id="prog"><div id="progBar"></div></div>

<script>
"use strict";
/* ============================================================
   IS256 × ica locus — deterministic timeline animation.
   Every visual state is a pure function of t (seconds, 0..D).
   URL modes: ?t=<sec> seek · ?render=1 capture mode · ?test=1 self-test
   Biology: S. aureus icaR–icaA–icaD–icaB–icaC; IS256 hot spot in icaC
   (Kiem et al. 2004, Ziebuhr et al. 1999); IcaR = DNA repressor.
   ============================================================ */

const D = 36;                 // loop duration (s)
const CH = [0, 9, 18, 27];    // chapter starts
const CAPTIONS = [
  ["ON — intact <tspan font-style='italic'>icaADBC</tspan> operon: IcaA·D builds the GlcNAc chain from UDP-GlcNAc,","IcaB deacetylates it, IcaC exports it → PNAG coat → biofilm on devices."],
  ["JUMP IN — transposase tnp256 cuts IS256 (~1.3 kb) out of its old site;","cut-and-paste integration lands in the <tspan font-style='italic'>icaC</tspan> hot spot, duplicating 8 bp at each end (TSD)."],
  ["OFF — no functional IcaC: the polymer can't be exported.","No PNAG on the surface → smooth cells drift free; the biofilm falls apart."],
  ["JUMP OUT — precise excision removes IS256 together with the duplicated 8-bp","TSD copies, restoring <tspan font-style='italic'>icaC</tspan> exactly. PIA/PNAG⁺ and biofilm return — phase variation."]
];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const seg = (t,a,b)=>clamp((t-a)/(b-a),0,1);
const easeIO = t=> t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeO  = t=> 1-Math.pow(1-t,3);
function setOp(el,f){ if(f==null) return; el.setAttribute("opacity", f.toFixed(3)); }

/* ---------- params / modes ---------- */
const P = new URLSearchParams(location.search);
let renderMode = P.get("render")==="1";
let testMode   = P.get("test")==="1";
let seekT      = P.has("t") ? clamp(parseFloat(P.get("t"))||0, 0, D-0.001) : null;

/* ---------- build legend ---------- */
(function buildLegend(){
  const items = [
    ["#4d7cfe","ica operon genes"],["#8b5cf6","IcaR repressor"],["#f97362","IS256 element"],
    ["#22d3ee","TSD (8-bp duplication)"],["#fbbf24","PNAG polymer"],["#cbd5e1","device surface"]
  ];
  const g = $("legendG"); let x=980, y=106;
  for(let i=0;i<items.length;i++){
    if(i===3){ x=980; y=128; }
    const [c,label]=items[i];
    const w = label.length*7.4 + 34;
    g.innerHTML += `<rect x="${x}" y="${y-15}" width="${w}" height="24" rx="12" fill="#ffffff" opacity=".82"/>`+
      `<circle cx="${x+15}" cy="${y-3}" r="7" fill="${c}"/>`+
      `<text x="${x+29}" y="${y+2}" font-size="13" fill="#475569">${label}</text>`;
    x += w + 10;
  }
})();

/* ---------- build chain beads (8) ---------- */
const BEAD_XS = [596,612,628,644,660,676,692,708];
(function buildBeads(){
  const g=$("beadsG"); let h="";
  for(let i=0;i<8;i++){
    h += `<circle id="b${i}" cx="${BEAD_XS[i]}" cy="560" r="7.5" fill="#f59e0b"/>`;
    if(i%3===2) h += `<path d="M${BEAD_XS[i]-4},556 l8,8 M${BEAD_XS[i]+4},556 l-8,8" stroke="#fff" stroke-width="1.6"/>`;
  }
  g.innerHTML=h;
})();

/* ---------- biofilm geometry ---------- */
const BF_HOME = [[1090,772],[1156,772],[1222,772],[1288,772],[1354,772],[1180,730],[1288,728]];
const BF_FREE = [[980,668],[1120,640],[1262,652],[1400,668],[1512,690],[1072,596],[1332,588]];

/* ---------- per-frame state (exposed for ?test=1) ---------- */
const S = {};

function render(t){
  t = ((t % D) + D) % D;
  const ch = t<9?0 : t<18?1 : t<27?2 : 3;

  /* ----- genome: IS256 element position ----- */
  let ix=1385, iy=205, irot=0, iscale=1;
  if(ch===1){                                    /* excise → fly to hot spot */
    const p = easeIO(seg(t,10.4,13.6));
    ix = 1385 + (994-1385)*p;                    // lands centered on the icaC body
    iy = 205 - Math.sin(p*Math.PI)*150;
    irot = Math.sin(p*Math.PI)*4;
    iscale = 1-.3*Math.sin(p*Math.PI);           /* shrink in flight so it clears the legend */
  } else if(ch===2){ ix=994; }
  else if(ch===3){                               /* precise excision, flies home carrying TSDs */
    const p = easeIO(seg(t,28.2,31.2));
    ix = 994 + (1385-994)*p;
    iy = 205 - Math.sin(p*Math.PI)*150;
    irot = -Math.sin(p*Math.PI)*4;
    iscale = 1-.3*Math.sin(p*Math.PI);
  }
  $("is256G").setAttribute("transform", `translate(${ix.toFixed(1)},${iy.toFixed(1)}) rotate(${irot.toFixed(2)}) scale(${iscale.toFixed(3)})`);

  /* home-site ghost + nicks (element away from home) */
  const away = (ch===1 && t>=10.4) || ch===2 || (ch===3 && t<31.4);
  setOp($("homeGhost"), away? .8:0);
  setOp($("nickL"), away? .9:0); setOp($("nickR"), away? .9:0);

  /* hotspot marker */
  const hs = (ch===0) ? 1 : ch===1 ? 1-seg(t,9.2,10.4) : ch===3 ? seg(t,31.6,33) : 0;
  setOp($("hotspotG"), hs);

  /* TSDs: inserted during ch1..ch2 (static), fly with IS256 in early ch3 */
  let tsdX=0, tsdVis=0;
  if(ch===1){ tsdVis=easeO(seg(t,15.4,16.8)); }                           // fade in at landing ends
  else if(ch===2){ tsdVis=1; }
  else if(ch===3){ tsdX=ix-994; tsdVis=t>=30.8?clamp((31.4-t)/0.6,0,1):1; } // bars ride the element home, then recombine away
  $("tsdL").setAttribute("transform",`translate(${tsdX.toFixed(1)},0)`); setOp($("tsdL"),tsdVis);
  $("tsdR").setAttribute("transform",`translate(${tsdX.toFixed(1)},0)`); setOp($("tsdR"),tsdVis);

  /* icaC broken state */
  const broken = (ch===1 && t>16.2) || ch===2 || (ch===3 && t<31.4);      // icaC restored only after excision lands home
  $("geneIcaC").setAttribute("fill-opacity", broken? .35 : 1);
  setOp($("xIcaC"), broken? .95:0);

  /* transposase + excision callouts */
  setOp($("tnpCallG"), ch===1 ? Math.min(seg(t,9.4,10), 1-seg(t,16.8,17.8)) : 0);
  const ex = ch===3 ? Math.min(seg(t,27.2,28), 1-seg(t,31.8,32.8)) : 0;
  setOp($("excCallG"), ex);

  /* ----- mRNA flow ----- */
  const on = ch===0 || (ch===1 && t<16.2) || (ch===3 && t>32.2);
  const mOpFinal = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-seg(t,16.2,17.4)) : ch===3 ? seg(t,32.2,33) : 0;
  setOp($("mrnaH"), mOpFinal); setOp($("mrnaV"), mOpFinal*.96); setOp($("mRnaHead"), mOpFinal);
  /* flowing dashes */
  if(on){ const off = (t*10)%20; $("mrnaH").setAttribute("stroke-dasharray","12 8"); $("mrnaH").setAttribute("stroke-dashoffset", -off);
          $("mrnaV").setAttribute("stroke-dasharray","12 8"); $("mrnaV").setAttribute("stroke-dashoffset", -off*1.5); }
  else { $("mrnaH").removeAttribute("stroke-dasharray"); $("mrnaV").removeAttribute("stroke-dasharray"); }

  const blk = (ch===1 && t>=16.2) || ch===2;
  setOp($("mrnaX"), blk? .97:0);
  setOp($("mrnaLblOn"), on? .95:0);
  setOp($("mrnaLblOffG"), blk? .98:0);

  /* ----- cell machinery ----- */
  const mach = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-seg(t,16.2,17.4)) : ch===2 ? 0 : seg(t,32.2,33.2);
  setOp($("transferG"), mach*.98); setOp($("udpG"), mach*.95);
  setOp($("udpArrow"), mach*.9);   setOp($("udpHead"), mach*.9);
  setOp($("icaBG"), mach*.97);

  /* chain: full during ON, short oligomer stub while OFF */
  const full = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-seg(t,16.2,17.4)) : ch===3 ? seg(t,32.4,35.2) : 0;
  const stub = ((ch===1&&t>=16.2)||ch===2);                    // trapped short oligomers while IcaC is broken
  const nBeads = Math.max(stub?3:0, Math.round(8*full));       // shrinks smoothly to the 3-bead stub
  setOp($("chainLine"), nBeads>0 ? .95:0);
  $("chainLine").setAttribute("x2", nBeads>0? BEAD_XS[nBeads-1]+6 : 586);
  for(let i=0;i<8;i++){ const b=$("b"+i); if(b) setOp(b, i<nBeads?1:0); }
  setOp($("oligoLbl"), stub && full<.05 ? .95:0);

  /* IcaC channel state */
  const chOff = (ch===1&&t>=16.2)||ch===2||(ch===3&&t<31.4);
  $("icaCG").setAttribute("fill-opacity", chOff? .3:1);
  setOp($("xIcaCP"), chOff? .95:0);

  /* PNAG coat */
  const coat = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-seg(t,16.2,17.8)) : ch===3 ? easeO(seg(t,33.2,35.4)) : 0;
  setOp($("coat1"), coat*.9); setOp($("coat2"), coat*.8);
  if(coat>0){ const r=((t/D)*90)%30; $("coat1").setAttribute("stroke-dashoffset", -r); $("coat2").setAttribute("stroke-dashoffset", r); }
  setOp($("coatLblG"), coat>.4? .97:0);

  /* ----- biofilm / device zone ----- */
  const bf = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-easeIO(seg(t,16.2,17.8))) : ch===3 ? easeIO(seg(t,33.4,35.6)) : 0;
  const plank = ch===0 ? 0 : ch===1 ? (t<16.2?0:easeIO(seg(t,16.2,17.8))) : ch===2 ? 1 : 1-bf;
  setOp($("matrixG"), bf*.5);
  for(let i=0;i<7;i++){
    const c=$("bf"+i), [hx,hy]=BF_HOME[i], [fx,fy]=BF_FREE[i];
    let x=hx, y=hy;
    if(ch===1 && t>=16.2){ const p=easeIO(seg(t,16.2,17.8)); x=hx+(fx-hx)*p; y=hy+(fy-hy)*p+Math.sin(t*2.1+i*1.7)*4*p; }
    else if(ch===2){ x=fx; y=fy+Math.sin(t*2.1+i*1.7)*4; }
    else if(ch===3){ const p=bf; x=hx+(fx-hx)*(1-p); y=hy+(fy-hy)*(1-p)+Math.sin(t*2.1+i*1.7)*4*(1-p); }
    c.setAttribute("cx",x.toFixed(1)); c.setAttribute("cy",y.toFixed(1)); setOp(c,1);
  }
  /* chips */
  const chipOn = ch===0 ? 1 : ch===1 ? (t<16.2?1:1-seg(t,16.2,17)) : ch===3 ? seg(t,32.4,33.2) : 0;
  const chipOff = (ch===1&&t>=16.2)? seg(t,16.4,17.4) : ch===2?1 : (ch===3 && t<32.8)? clamp((32.8-t)/0.8,0,1) : 0;
  setOp($("chipOnG"),chipOn); setOp($("chipOffG"),chipOff);

  /* adhesion link */
  const stick = chipOn>0 ? .95*(ch===3?seg(t,32.4,33.4):1) : 0;
  setOp($("linkPath"), stick*.9); setOp($("linkHeadP"), stick); setOp($("linkLblOn"), stick);
  if(stick>0){ $("linkPath").setAttribute("stroke-dasharray","10 8"); $("linkPath").setAttribute("stroke-dashoffset", -((t*34)%18)); }
  const noStick = (ch===1&&t>=16.2)? seg(t,17,18) : ch===2 ? 1 : (ch===3 && t<32.4) ? clamp((32.4-t)/0.8,0,1) : 0;
  setOp($("linkX"), noStick*.95); setOp($("linkLblOffG"), noStick);

  /* planktonic label */
  setOp($("plankLblG"), ch===2 ? seg(t,22.4,23.6) : (ch===3 && t<33.4)? clamp((33.8-t)/0.8,0,1) : 0);

  /* caption */
  const cap = $("capText"), ck = ch+"|"+CAPTIONS[ch][0].length;
  if(cap.dataset.k!==ck){ cap.dataset.k=ck; cap.innerHTML = CAPTIONS[ch][0]+`<tspan x="376" dy="20">${CAPTIONS[ch][1]}</tspan>`; }
  setOp($("titleG"), .98);

  S.t=t; S.chapter=ch;
  S.is256={x:ix,y:iy,insideIcaC:(ix>=909&&ix<=1079),atHome:(ix>1370)}; // in-situ span at the icaC hot spot
  S.icaCBroken=broken; S.mRNAon=!!(mOpFinal>.4); S.coat=coat; S.biofilm=bf; S.planktonic=plank;
}

/* ---------- self-test (?test=1) ---------- */
function runSelfTest(){
  const checks=[
    [2,  s=>s.chapter===0 && !s.icaCBroken && s.mRNAon],
    [7.5,s=>s.coat>.6 && s.biofilm>.8 && s.is256.atHome],
    [12, s=>!s.is256.atHome && Math.abs(s.is256.y-205)>40],          // in flight (arc apex)
    [17.5,s=>s.is256.insideIcaC && s.icaCBroken && !s.mRNAon],
    [23, s=>s.planktonic>.9 && s.biofilm<.05 && s.coat<.05 && s.icaCBroken],
    [31.6, s=>!s.is256.insideIcaC && !s.icaCBroken],                  // excised, gene restored
    [34.8,s=>s.mRNAon && s.coat>.5 && s.biofilm>.7 && s.is256.atHome]
  ];
  let ok=true; const fails=[];
  for(const [t,pred] of checks){ render(t); if(!pred(S)) {ok=false; fails.push(`t=${t}: state=${JSON.stringify(S)}`);} }
  /* seam: last frame ≈ first frame (visual state only) */
  const snap = () => ({x:Math.round(S.is256.x),y:Math.round(S.is256.y),coat:+S.coat.toFixed(2),biofilm:+S.biofilm.toFixed(2),mRNAon:S.mRNAon,broken:S.icaCBroken,planktonic:+S.planktonic.toFixed(2)});
  render(35.98); const a=snap();
  render(0.02);   const b=snap();
  if(Math.abs(a.x-b.x)>4||Math.abs(a.y-b.y)>4||Math.abs(a.coat-b.coat)>.1||Math.abs(a.biofilm-b.biofilm)>.1||a.mRNAon!==b.mRNAon||a.broken!==b.broken){ ok=false; fails.push(`seam mismatch ${JSON.stringify({end:a,start:b})}`); }
  document.body.dataset.selftest = ok?"PASS":"FAIL";
  $("badge").textContent = `self-test: ${ok?"PASS":"FAIL"}`+(fails.length? " — "+fails[0]:"");
  return {ok, fails};
}

/* ---------- interaction / loop ---------- */
let speed=1, last=null;
const playBtn=$("playBtn"), dotsG=$("dots");
for(let i=0;i<4;i++){ const d=document.createElement("button"); d.className="dot"; d.type="button";
  d.addEventListener("click",e=>{ e.stopPropagation(); seek(CH[i]+0.01); }); dotsG.appendChild(d); }

function seek(t){ if(seekT!=null) return; render(t); last=null; syncUI(t); }
function syncUI(t){
  const ch = t<9?0 : t<18?1 : t<27?2 : 3;
  [...dotsG.children].forEach((d,i)=>d.classList.toggle("active",i===ch));
  $("progBar").style.width=(t/D*100).toFixed(2)+"%";
}
playBtn.addEventListener("click",e=>{ e.stopPropagation(); playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });
$("resetBtn").addEventListener("click",e=>{ e.stopPropagation(); seek(0); if(!playing){playing=true;playBtn.textContent="⏸ Pause";} });
$("spd").addEventListener("input",()=>{ speed=parseFloat($("spd").value); $("spdVal").textContent=speed.toFixed(1)+"×"; });
if(!renderMode) $("stage").addEventListener("pointerdown",e=>{ if(e.target.closest("#ui")) return; playing=!playing; playBtn.textContent=playing?"⏸ Pause":"▶ Play"; last=null; });

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
/* frozen frame in capture/test mode and when an explicit ?t= is given (play button still starts it) */
let playing = !(renderMode || testMode) && seekT==null && !reduce;
playBtn.textContent = playing?"⏸ Pause":"▶ Play";

let curT = seekT!=null ? seekT : 0;
function frame(ts){
  if(playing && last!=null){ curT=(curT+(ts-last)/1000*speed)%D; render(curT); syncUI(curT); }
  last=ts; requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
if(renderMode) document.body.classList.add("render-mode");
render(curT); syncUI(curT);
if(testMode){ const r=runSelfTest(); console.log(r.ok?"SELF-TEST PASS":"SELF-TEST FAIL", r.fails||""); }
requestAnimationFrame(frame);
window.__IS256 = { render, D, state:()=>S };   // handle for external frame capture
</script>
